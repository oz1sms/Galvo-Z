; Shared settings for both target boards
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2

; Environment 1: Standard 38-pin ESP32 WROOM DA DevKit
[env:esp32_wroom_da]
board = esp32dev
build_flags =
    -D ACTIVE_BOARD=0

; Environment 2: WeAct Studio CAN485 DevBoard V1
[env:weact_can485_v1]
board = esp32dev
build_flags =
    -D ACTIVE_BOARD=1